<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Fleet Palette Studio</title>
<style>body{margin:0;background:#07151f;color:#d6e8ee;font:16px system-ui}main{max-width:1120px;margin:24px auto;padding:20px}h1{color:#98e4da}section{display:grid;grid-template-columns:1fr 1fr;gap:28px}canvas{width:100%;image-rendering:pixelated;background:#061420;border:1px solid #365b6b;border-radius:8px}label{display:block;margin:10px 0}select,button{background:#173c4b;color:#e3f3f1;border:1px solid #47717e;border-radius:5px;padding:8px;font:inherit}select{width:100%}input[type=color]{width:65px;height:30px;vertical-align:middle}.colors{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}small{color:#9bb6c1}button{margin:8px 8px 8px 0}@media(max-width:700px){section{grid-template-columns:1fr}}</style>
<main><h1>Pocket Fleet · Palette Studio</h1><p>Six cadets. Fixed color indexes. Character-specific overlay sprites.</p><section><div><canvas id="badge" width="320" height="240"></canvas><p><small>320 × 240 badge preview</small></p><canvas id="portrait" width="128" height="128"></canvas><p id="info"></p></div><div>
<label>Cadet<select id="character"></select></label><label>Mode<select id="mode"><option value="frame">Complete expression / hairstyle</option><option value="layers">Combine overlay sprites</option></select></label><label>Expression / hairstyle<select id="frame"></select></label><div id="parts"></div><div id="colors" class="colors"></div><button id="animate">Animate</button><button id="reset">Reset palette</button><button id="export">Export preview PNG</button><p><small>The PNG export is an RGBA preview. The indexed source PNGs and raw index buffers are in indexed/. Color controls change palette entries; no masks are used by this viewer.</small></p></div></section></main>
<script src="indexed_preview_data.js"></script><script>
const $=id=>document.getElementById(id),cache=new Map();let palette=[],epoch=0,timer=null,tick=0;
const groups=['hair_styles','eyebrows','eyes','mouth','facial_hair','cosmetics'];const humanize=s=>s.replaceAll('_',' ');
function options(el,values){el.replaceChildren(...values.map(v=>{let o=document.createElement('option');o.value=v;o.textContent=humanize(v);return o}))}
for(let group of groups){let l=document.createElement('label');l.textContent=humanize(group);let s=document.createElement('select');s.id=group;l.append(s);$('parts').append(l)}
for(let [role,indices]of Object.entries(COLOR_GROUPS)){let l=document.createElement('label');l.textContent=humanize(role)+' ';let inp=document.createElement('input');inp.type='color';inp.id='color_'+role;inp.oninput=()=>{let p=INDEX_PACK[$('character').value],rgb=inp.value.match(/\w\w/g).map(s=>parseInt(s,16)),base=p.palette[indices[0]],lum=Math.max(...base)||1;for(let i of indices){let ratio=Math.max(...p.palette[i])/lum;palette[i]=rgb.map(v=>Math.min(255,Math.round(v*ratio)))}render()};l.append(inp);$('colors').append(l)}
options($('character'),Object.keys(INDEX_PACK));
function reset(){palette=INDEX_PACK[$('character').value].palette.map(x=>x.slice());for(let [role,ids]of Object.entries(COLOR_GROUPS))$('color_'+role).value='#'+palette[ids[0]].map(v=>v.toString(16).padStart(2,'0')).join('');render()}
function init(){let p=INDEX_PACK[$('character').value];options($('frame'),Object.keys(p.frames));for(let g of groups)options($(g),g==='eyes'||g==='eyebrows'||g==='mouth'?Object.keys(p.layers[g]):['none',...Object.keys(p.layers[g]||{})]);reset()}
async function decode(src){if(!cache.has(src))cache.set(src,new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>{let c=document.createElement('canvas');c.width=c.height=128;let x=c.getContext('2d');x.drawImage(i,0,0);let d=x.getImageData(0,0,128,128).data;resolve(Uint8Array.from({length:16384},(_,k)=>d[k*4]))};i.onerror=reject;i.src=src}));return cache.get(src)}
async function render(){let request=++epoch,p=INDEX_PACK[$('character').value],mode=$('mode').value,ids;
 $('parts').style.display=mode==='layers'?'block':'none';
 if(mode==='frame')ids=(await decode(p.indexmaps['frames/'+$('frame').value+'.png'])).slice();else{ids=(await decode(p.indexmaps['layers/base.png'])).slice();for(let g of groups){let state=$(g).value;if(timer&&g==='eyes')state=tick%12===0?'blink':state;if(timer&&g==='mouth')state=['neutral','talk_small','talk_wide'][tick%3];if(state==='none')continue;let src=p.indexmaps['layers/'+g+'/'+state+'.png'];if(!src)continue;let part=await decode(src);for(let k=0;k<ids.length;k++)if(part[k])ids[k]=part[k]}}
 if(request!==epoch)return;let pc=$('portrait').getContext('2d'),im=pc.createImageData(128,128);for(let k=0;k<ids.length;k++){let c=palette[ids[k]];im.data.set([c[0],c[1],c[2],ids[k]?255:0],k*4)}pc.putImageData(im,0,0);
 let b=$('badge').getContext('2d');b.imageSmoothingEnabled=false;b.fillStyle='#061420';b.fillRect(0,0,320,240);b.fillStyle='#98ded8';b.font='bold 12px monospace';b.fillText('POCKET FLEET',9,18);b.fillText('MY ROOM >',236,18);b.fillStyle='#36515c';b.fillRect(9,26,302,1);b.fillStyle='#0a202c';b.fillRect(9,36,126,160);b.drawImage($('portrait'),18,48,112,112);b.fillStyle='#e5eeee';b.font='bold 17px monospace';b.fillText('Cadet',143,61);b.font='11px monospace';b.fillStyle='#98ded8';b.fillText('LEVEL 2',143,87);b.fillText('192 XP · 0 missions',143,111);b.fillText('0 pods · 0 kills',143,134);b.fillStyle='#173f4e';b.fillRect(9,197,302,34);b.fillStyle='#a1e8de';b.font='bold 13px monospace';b.fillText('BOARD BRIDGE',109,218);$('info').textContent='128 × 128 indexed portrait · shared 64-slot palette · index 0 is transparent';}
document.querySelectorAll('select').forEach(e=>e.onchange=e.id==='character'?init:render);$('reset').onclick=reset;
$('animate').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('animate').textContent='Animate'}else{$('mode').value='layers';timer=setInterval(()=>{tick++;render()},180);$('animate').textContent='Stop'}render()};
$('export').onclick=()=>{let a=document.createElement('a');a.download=$('character').value+'-preview.png';a.href=$('portrait').toDataURL();a.click()};init();
</script></html>
